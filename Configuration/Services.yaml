services:
   _defaults:
      autowire: true
      autoconfigure: true
      public: false

   WEBcoast\DotForms\:
      resource: '../Classes/*'
      exclude: '../Classes/Domain/Model/*'

   # Override core DefaultTcaSchema.
   TYPO3\CMS\Core\Database\Schema\DefaultTcaSchema:
      class: WEBcoast\DotForms\Database\Schema\TcaSchemaOverride

   # Configure data processor
   WEBcoast\DotForms\DataProcessing\DotFormsDataProcessor:
      tags:
         - name: data.processor
           identifier: dot-forms

   # Configure event listener
   WEBcoast\DotForms\EventListener\AlterTableDefinitionStatementEventListener:
      tags:
         -  name: event.listener
            identifier: dot-forms_alter_table_definition_statement_listener
